name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: JDK
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: Projeyi bul
        id: proj
        run: |
          set -euo pipefail
          ROOT=.
          # Zip varsa ac, yoksa dosyalar zaten acik demektir
          if ls ./*.zip >/dev/null 2>&1; then
            Z=$(ls ./*.zip | head -n 1)
            echo "Zip bulundu: $Z"
            mkdir -p work
            unzip -q "$Z" -d work
            ROOT=work
          else
            echo "Zip yok, repodaki dosyalar kullanilacak"
          fi
          G=$(find "$ROOT" -name gradlew -not -path '*/.git/*' | awk '{print length, $0}' | sort -n | head -n 1 | cut -d' ' -f2- || true)
          if [ -z "$G" ]; then
            echo "HATA: gradlew dosyasi bulunamadi. Dosyalar eksik yuklenmis olabilir."
            find . -maxdepth 3 -not -path './.git/*' | head -60
            exit 1
          fi
          echo "Proje klasoru: $(dirname "$G")"
          echo "dir=$(dirname "$G")" >> "$GITHUB_OUTPUT"

      - name: Derle
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          chmod +x ./gradlew
          sed -i 's/^networkTimeout=.*/networkTimeout=120000/' gradle/wrapper/gradle-wrapper.properties
          for i in 1 2 3; do
            ./gradlew build --no-daemon && exit 0
            echo "Deneme $i basarisiz, tekrar deneniyor..."
            sleep 15
          done
          exit 1

      - name: Jar'i yukle
        uses: actions/upload-artifact@v7
        with:
          name: screenmod-jar
          path: |
            **/build/libs/*.jar
            !**/build/libs/*-sources.jar
